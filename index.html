<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CompTIA Security+ SY0-701 — Progress Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1a1e2a;
    --border: #1f2430;
    --border2: #252b3a;
    --green: #00e676;
    --green-dim: rgba(0,230,118,0.10);
    --red: #ff4444;
    --yellow: #ffd740;
    --blue: #40c4ff;
    --purple: #b39ddb;
    --muted: #4a5568;
    --muted2: #2d3748;
    --text: #c9d1d9;
    --white: #e6edf3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100%;}
  body{padding-bottom:60px;}

  /* TOP BAR */
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;top:0;z-index:100;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .cert-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--blue);
    border:1px solid rgba(64,196,255,0.3);
    padding:3px 8px;border-radius:2px;
    background:rgba(64,196,255,0.07);
  }
  .topbar-title{font-size:14px;font-weight:600;color:var(--white);}
  .topbar-sub{font-size:11px;color:var(--muted);}

  /* HERO */
  .hero{
    background:linear-gradient(135deg,#0d0f14 0%,#0a1628 100%);
    border-bottom:1px solid var(--border);
    padding:40px 20px 32px;
    text-align:center;
  }
  .hero h1{font-size:clamp(22px,4vw,36px);font-weight:700;color:var(--white);margin-bottom:8px;}
  .hero h1 span{color:var(--blue);}
  .hero p{font-size:13px;color:var(--muted);max-width:480px;margin:0 auto;}

  /* GLOBAL PROGRESS */
  .global-bar-wrap{max-width:860px;margin:24px auto 0;padding:0 20px;}
  .global-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 16px;
    text-align:center;
  }
  .stat-num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--white);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:3px;}
  .global-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .global-fill{height:100%;background:linear-gradient(90deg,#00e676,#40c4ff);border-radius:4px;transition:width .4s ease;}

  /* FILTER BAR */
  .filter-bar{
    max-width:860px;margin:20px auto 0;padding:0 20px;
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .filter-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;padding:5px 12px;border-radius:2px;
    border:1px solid var(--border2);
    background:var(--surface);color:var(--muted);
    cursor:pointer;transition:.15s;
  }
  .filter-btn:hover{border-color:var(--blue);color:var(--blue);}
  .filter-btn.active{background:rgba(64,196,255,0.1);border-color:var(--blue);color:var(--blue);}
  .filter-btn.priority{background:rgba(255,215,64,0.07);border-color:rgba(255,215,64,0.3);color:var(--yellow);}
  .filter-btn.priority.active{background:rgba(255,215,64,0.15);}

  /* MAIN */
  .container{max-width:860px;margin:0 auto;padding:24px 20px;}

  /* SECTION */
  .section{margin-bottom:32px;}
  .section-header{
    display:flex;align-items:center;gap:12px;
    margin-bottom:14px;
    cursor:pointer;user-select:none;
  }
  .section-icon{
    width:32px;height:32px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;
  }
  .sec1{background:rgba(64,196,255,0.12);}
  .sec2{background:rgba(255,68,68,0.12);}
  .sec3{background:rgba(179,157,219,0.12);}
  .sec4{background:rgba(0,230,118,0.12);}
  .sec5{background:rgba(255,215,64,0.12);}
  .section-title-wrap{flex:1;}
  .section-title{font-size:15px;font-weight:600;color:var(--white);}
  .section-subtitle{font-size:12px;color:var(--muted);margin-top:2px;}
  .section-prog{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--muted);
    white-space:nowrap;margin-left:auto;
  }
  .section-prog.done{color:var(--green);}
  .chevron{font-size:12px;color:var(--muted);transition:.2s;}
  .section-header.collapsed .chevron{transform:rotate(-90deg);}

  /* SECTION PROGRESS BAR */
  .sec-track{height:3px;background:var(--surface2);border-radius:2px;margin-bottom:12px;overflow:hidden;}
  .sec-fill{height:100%;border-radius:2px;transition:width .3s;}
  .fill-blue{background:var(--blue);}
  .fill-red{background:var(--red);}
  .fill-purple{background:var(--purple);}
  .fill-green{background:var(--green);}
  .fill-yellow{background:var(--yellow);}

  /* TOPIC CARDS */
  .topics-grid{display:flex;flex-direction:column;gap:6px;}
  .topic-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
    display:flex;align-items:flex-start;gap:12px;
    cursor:pointer;transition:.15s;
  }
  .topic-card:hover{border-color:var(--border2);background:var(--surface2);}
  .topic-card.checked{
    border-color:rgba(0,230,118,0.25);
    background:rgba(0,230,118,0.04);
  }
  .topic-card.hidden{display:none;}
  .checkbox{
    width:18px;height:18px;border-radius:3px;
    border:1px solid var(--border2);
    background:var(--surface2);
    flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .topic-card.checked .checkbox{
    background:var(--green);border-color:var(--green);
  }
  .checkbox::after{
    content:'';display:none;
    width:5px;height:9px;
    border:2px solid #0d0f14;border-top:none;border-left:none;
    transform:rotate(45deg) translateY(-1px);
  }
  .topic-card.checked .checkbox::after{display:block;}
  .topic-info{flex:1;min-width:0;}
  .topic-name{font-size:13px;font-weight:500;color:var(--white);line-height:1.4;}
  .topic-card.checked .topic-name{color:var(--muted);}
  .topic-meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap;}
  .topic-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;color:var(--muted);
  }
  .topic-dur{font-size:11px;color:var(--muted);}
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;padding:2px 6px;border-radius:2px;
  }
  .badge-must{background:rgba(0,230,118,0.12);color:var(--green);}
  .badge-skip{background:rgba(74,85,104,0.3);color:var(--muted);}
  .badge-practical{background:rgba(64,196,255,0.1);color:var(--blue);}

  /* RESET */
  .reset-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:6px 14px;border-radius:2px;
    border:1px solid var(--border2);
    background:transparent;color:var(--muted);
    cursor:pointer;transition:.15s;
  }
  .reset-btn:hover{border-color:var(--red);color:var(--red);}

  @media(max-width:480px){
    .global-stats{grid-template-columns:repeat(3,1fr);}
    .stat-num{font-size:18px;}
    .topbar-title{font-size:13px;}
  }
</style>
</head>

let state = {};
let filter = 'all';
let collapsed = {};

function saveState(){try{localStorage.setItem('sy701_state',JSON.stringify(state));}catch(e){}}
function loadState(){try{const d=localStorage.getItem('sy701_state');if(d)state=JSON.parse(d);}catch(e){state={};}}
function saveSections(){try{localStorage.setItem('sy701_collapsed',JSON.stringify(collapsed));}catch(e){}}
function loadSections(){try{const d=localStorage.getItem('sy701_collapsed');if(d)collapsed=JSON.parse(d);}catch(e){}}

loadState();loadSections();

function toggle(id){
  state[id]=!state[id];
  saveState();
  render();
}
function toggleSection(sid){
  collapsed[sid]=!collapsed[sid];
  saveSections();
  renderSection(sid);
}
function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function resetAll(){
  if(!confirm('Reset all progress?')) return;
  state={};collapsed={};saveState();saveSections();render();
}

function render(){
  updateGlobal();
  SECTIONS.forEach(s=>{
    renderSection(s.id);
    updateSectionBar(s);
  });
}

function updateGlobal(){
  let total=0,done=0;
  SECTIONS.forEach(s=>s.topics.forEach(t=>{total++;if(state[t.id])done++;}));
  document.getElementById('doneCount').textContent=done;
  document.getElementById('totalCount').textContent=total;
  document.getElementById('pctCount').textContent=Math.round(done/total*100)+'%';
  document.getElementById('globalFill').style.width=(done/total*100)+'%';
}

function updateSectionBar(sec){
  const el=document.getElementById('secbar_'+sec.id);
  if(!el) return;
  let total=sec.topics.length,done=sec.topics.filter(t=>state[t.id]).length;
  el.style.width=(done/total*100)+'%';
  const prog=document.getElementById('secprog_'+sec.id);
  if(prog){
    prog.textContent=done+'/'+total;
    prog.className='section-prog'+(done===total?' done':'');
  }
}

function renderSection(sid){
  const cards=document.querySelectorAll(`[data-section="${sid}"]`);
  const isCollapsed=collapsed[sid];
  cards.forEach(card=>{
    const id=card.dataset.topic;
    const sec=SECTIONS.find(s=>s.id===sid);
    const t=sec.topics.find(x=>x.id===id);
    const checked=!!state[id];
    let visible=true;
    if(filter==='must') visible=t.must;
    else if(filter==='done') visible=checked;
    else if(filter==='todo') visible=!checked;
    const inCollapsed=isCollapsed&&!checked;
    card.className='topic-card'+(checked?' checked':'')+((!visible||inCollapsed)?' hidden':'');
  });
  const chevron=document.getElementById('chev_'+sid);
  if(chevron) chevron.textContent=isCollapsed?'›':'⌄';
  const header=document.getElementById('sh_'+sid);
  if(header){
    if(isCollapsed) header.classList.add('collapsed');
    else header.classList.remove('collapsed');
  }
  updateSectionBar(SECTIONS.find(s=>s.id===sid));
}

function buildUI(){
  const main=document.getElementById('main');
  main.innerHTML='';
  SECTIONS.forEach(sec=>{
    const div=document.createElement('div');
    div.className='section';
    div.innerHTML=`
      <div class="section-header" id="sh_${sec.id}" onclick="toggleSection('${sec.id}')">
        <div class="section-icon ${sec.iconClass}">${sec.emoji}</div>
        <div class="section-title-wrap">
          <div class="section-title">${sec.title}</div>
          <div class="section-subtitle">${sec.sub}</div>
        </div>
        <div class="section-prog" id="secprog_${sec.id}">0/${sec.topics.length}</div>
        <div class="chevron" id="chev_${sec.id}">⌄</div>
      </div>
      <div class="sec-track"><div class="sec-fill ${sec.fillClass}" id="secbar_${sec.id}" style="width:0%"></div></div>
      <div class="topics-grid" id="grid_${sec.id}">
        ${sec.topics.map(t=>`
          <div class="topic-card" data-section="${sec.id}" data-topic="${t.id}" onclick="toggle('${t.id}')">
            <div class="checkbox"></div>
            <div class="topic-info">
              <div class="topic-name">${t.name}</div>
              <div class="topic-meta">
                <span class="topic-code">${t.code}</span>
                <span class="topic-dur">⏱ ${t.dur}</span>
                ${t.must?'<span class="badge badge-must">MUST WATCH</span>':'<span class="badge badge-skip">SKIP NOW</span>'}
                ${t.practical?'<span class="badge badge-practical">PRACTICAL</span>':''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    main.appendChild(div);
  });
}

buildUI();
render();
</script>
